name: auto_sos
description: Application de dépannage automobile en Côte d'Ivoire — Oyop MT
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.1
  firebase_auth: ^4.17.9
  cloud_firestore: ^4.15.9
  firebase_storage: ^11.6.10
  firebase_messaging: ^14.7.19
  firebase_analytics: ^10.8.9

  # Maps & Location
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  flutter_polyline_points: ^2.0.0

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^13.2.1

  # UI
  flutter_rating_bar: ^4.0.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  flutter_svg: ^2.0.10+1
  pinput: ^3.0.1
  intl_phone_field: ^3.2.0
  image_picker: ^1.0.7
  percent_indicator: ^4.2.3

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.2.6
  share_plus: ^7.2.2
  connectivity_plus: ^5.0.2
  shared_preferences: ^2.2.3
  package_info_plus: ^5.0.1
  uuid: ^4.4.0
  timeago: ^3.6.1

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/

  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
  # Pour activer Poppins: téléchargez les fichiers sur fonts.google.com
  # et décommentez cette section.
